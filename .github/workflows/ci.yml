name: CI

on:
  push:
  pull_request:

jobs:
  test38:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q chaoxing standalone adapters tools tests main.py
      - run: python -m pytest -q

  test312:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q chaoxing standalone adapters tools tests main.py
      - run: python -m pytest -q
