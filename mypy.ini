# Scope: core logic only (chaoxing/, policy.py, audit.py).
# main.py / webui.py depend on astrbot.api which ships no type stubs,
# so annotating them yields Any everywhere -- low value until upstream adds stubs.
# NOTE: keep this file ASCII-only. Windows configparser reads it with the
# locale encoding (GBK), and non-ASCII comments break local runs.
[mypy]
ignore_missing_imports = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
files = chaoxing, policy.py, audit.py

[mypy-astrbot.*]
ignore_errors = True
