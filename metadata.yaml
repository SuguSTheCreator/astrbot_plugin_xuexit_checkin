name: astrbot_plugin_xuexit_checkin
display_name: 健康日报自动填写
short_desc: 按表单链接定时填写健康日报，结果可推送
desc: |
  读取你提供的表单链接与本人授权的登录状态，在设定时间窗口内自动填写并提交健康日报，
  结果可推送到 QQ 会话或 Webhook。支持多账号、扫码授权、随机延迟、失败分类与告警。
  本插件不内置任何平台凭据，也不修改平台的安全校验；提交内容与使用场景由使用者自行负责。
  亦可作为命令行工具在 cron 或系统任务计划中运行。
version: 0.7.0
